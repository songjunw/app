name: Build iOS ipa (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project FnOSMusic.xcodeproj -scheme FnOSMusic \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO build

      - name: Package ipa
        run: |
          APP=$(find build -name "FnOSMusic.app" -type d | head -n1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r FnOSMusic.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: FnOSMusic-unsigned
          path: FnOSMusic.ipa
