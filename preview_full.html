<title>全屏播放页预览</title>
<style>
:root{
  --bg:#0b0d12; --panel:#12161e; --panel2:#171c26; --line:#232a37;
  --txt:#e7ebf3; --txt2:#98a2b6; --txt3:#5f6982;
  --acc:#6d8cff; --acc2:#a06bff; --ok:#3ecf8e; --warn:#ffb454; --err:#ff6b6b;
  --bar:64px;
  --sat:0px; --sab:0px; --sal:0px; --sar:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100dvh;overflow:hidden}
body{background:#000;display:flex;align-items:center;justify-content:center}

/* 手机模拟框 */
.phone{
  width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:var(--bg);color:var(--txt);
  font:15px/1.5 -apple-system,"Roboto","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* ===== 以下与原 player.html 全屏页相关样式一致 ===== */
#full{
  position:absolute;inset:0;background:var(--bg);z-index:50;
  display:flex;flex-direction:column;
  padding:var(--sat) calc(26px + var(--sar)) calc(10px + var(--sab)) calc(26px + var(--sal));
  overflow:hidden;
}
#fullAura{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 8%, rgba(109,140,255,.22), transparent 60%);
  transition:background .5s ease;
}
#full .ftext,#full .artwrap,#full .seekwrap,#full .fctrl,#full .fbot{position:relative;z-index:1}
.artwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0;position:relative}
.art{
  width:min(74vw,300px);aspect-ratio:1;border-radius:50%;position:relative;
  background:conic-gradient(from 0deg,#232a37,#1a2030,#232a37);
  animation:spin 14s linear infinite;animation-play-state:running;
  box-shadow:
    0 24px 70px rgba(0,0,0,.6),
    0 8px 30px rgba(109,140,255,.14),
    inset 0 0 0 1px rgba(255,255,255,.04);
}
@keyframes spin{to{transform:rotate(360deg)}}
.art::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle at center,#0d1017 0 2px,#11151e 2px 4px,#0d1017 4px 6px);
  box-shadow:inset 0 0 40px rgba(0,0,0,.75);}
.art::after{content:"";position:absolute;inset:42%;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 0 24px rgba(109,140,255,.4), inset 0 0 0 2px rgba(255,255,255,.12);}
.art .sheen{position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
  background:conic-gradient(from 210deg,transparent 0deg,rgba(255,255,255,.06) 40deg,transparent 90deg);}
.art .hole{position:absolute;inset:46.5%;border-radius:50%;background:#0b0d12;z-index:3;
  box-shadow:inset 0 0 3px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03);}
#artimg{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center;background-color:#1a2030;opacity:0;transition:opacity .4s;z-index:4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.art.hascover #artimg{opacity:1}
.art.hascover .sheen,.art.hascover .hole{opacity:0}

.ftext{flex:none;text-align:center;padding:14px 0 6px}
.ftext .ft{font-size:21px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftext .fa{font-size:13px;color:var(--txt3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metatip{font-size:11px;color:var(--acc2);margin-top:6px;min-height:0;opacity:0;transition:opacity .2s}
.metatip.on{opacity:1}
.ftrow{display:flex;align-items:center;justify-content:center;gap:12px}
.ftrow .favbtn{width:38px;height:38px;font-size:24px;background:var(--panel2);border:1px solid var(--line);border-radius:50%}
.favbtn{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:20px}
.favbtn.act{color:var(--err)}

.seekwrap{flex:none;padding:2px 0 6px}
.track{height:32px;display:flex;align-items:center;position:relative}
.track .rail{height:5px;width:100%;background:#1c2230;border-radius:4px;overflow:visible;position:relative}
.track .buf{position:absolute;left:0;top:0;bottom:0;background:#2a3243;width:0;border-radius:4px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;border-radius:4px}
.track .knob{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(109,140,255,.6),0 2px 6px rgba(0,0,0,.5);left:0;transform:translateX(-50%)}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt3);font-variant-numeric:tabular-nums;margin-top:2px}

.fctrl{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 2px 6px}
.fbtn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txt2);background:transparent;position:relative}
.fbtn svg{width:22px;height:22px;fill:currentColor}
.fbtn.big{width:72px;height:72px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 10px 30px rgba(109,140,255,.38), 0 0 0 6px rgba(109,140,255,.08)}
.fbtn.big svg{width:28px;height:28px}
.fbtn.act{color:var(--acc)}
.fbtn .badge{position:absolute;bottom:6px;font-size:9px;font-weight:700}

.fbot{flex:none;display:flex;align-items:center;gap:12px;padding:6px 0 18px;color:var(--txt3);font-size:12px}
.fbot .vol{flex:1;height:22px;display:flex;align-items:center;position:relative}
.fbot .vol .rail{height:3px;width:100%;background:#1e2431;border-radius:3px;position:relative;overflow:hidden}
.fbot .vol .fill{position:absolute;left:0;top:0;bottom:0;background:var(--txt2);width:80%}
</style>
</head>

<script>
// 用一张暖色渐变当封面，演示取色光晕
var cover = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e08a5a"/><stop offset=".5" stop-color="#c05f7d"/><stop offset="1" stop-color="#5a3f8f"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/></svg>'
);
document.getElementById('artimg').style.backgroundImage = 'url(' + cover + ')';

// 取色光晕
(function(){
  var au = document.getElementById('fullAura');
  var img = new Image();
  img.onload = function(){
    var c = document.createElement('canvas'); c.width=32; c.height=32;
    var g = c.getContext('2d'); g.drawImage(img,0,0,32,32);
    var d = g.getImageData(0,0,32,32).data;
    var r=0,gg=0,b=0,n=0;
    for(var i=0;i<d.length;i+=16){r+=d[i];gg+=d[i+1];b+=d[i+2];n++;}
    r=Math.round(r/n);gg=Math.round(gg/n);b=Math.round(b/n);
    au.style.background = 'radial-gradient(120% 72% at 50% 6%, rgba('+r+','+gg+','+b+',.34), transparent 62%),radial-gradient(90% 60% at 50% 30%, rgba('+r+','+gg+','+b+',.12), transparent 60%)';
  };
  img.src = cover;
})();
</script>
